name: Deploy ZIP Package into CPI Designtime
description: Deploy ZIP Package into CPI Designtime

inputs:
  bearer-token:
    description: "BEARER Token to access Integration Suite Artifacts"
    required: true
  btp-api-url:
    description: "BTP API URL"
    required: true 
  zip-location:
    description: "Path to ZIP File to Upload"
    required: true
  package-id:
    description: "Package ID"
    required: true

runs:
  using: "composite"
  steps:
    - id: deploy-package
      shell: bash
      env:
        BEARER_TOKEN: ${{ inputs.bearer-token }}
        BTP_API_URL: ${{ inputs.btp-api-url }}
        ZIPLOCATION: ${{ inputs.zip-location }}
        PACKAGEID: ${{ inputs.package-id }}
        
      run: |
        PACKAGE_TECH_ID="$PACKAGEID"

        echo "Extracting Package Name and Description from ZIP..."
        mkdir -p tmp_pkg_meta
        unzip -q -o "$ZIPLOCATION" "META-INF/MANIFEST.MF" "package-metadata.json" -d tmp_pkg_meta || true
        
        PKG_NAME="$PACKAGEID"
        PKG_DESC="$PACKAGEID"
        
        if [ -f "tmp_pkg_meta/package-metadata.json" ]; then
           # Use metadata fetched during import if available
           EXTRACTED_NAME=$(jq -r '.d.Name // .Name // empty' tmp_pkg_meta/package-metadata.json)
           EXTRACTED_DESC=$(jq -r '.d.ShortText // .ShortText // empty' tmp_pkg_meta/package-metadata.json)
           
           if [ -n "$EXTRACTED_NAME" ]; then PKG_NAME="$EXTRACTED_NAME"; fi
           if [ -n "$EXTRACTED_DESC" ]; then PKG_DESC="$EXTRACTED_DESC"; fi
        elif [ -f "tmp_pkg_meta/META-INF/MANIFEST.MF" ]; then
           # Fallback to MANIFEST.MF if it exists
           EXTRACTED_NAME=$(awk '/^Bundle-Name:/{flag=1; s=$0; next} flag && /^ /{s=s $0; next} flag{print s; exit}' tmp_pkg_meta/META-INF/MANIFEST.MF | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\r')
           EXTRACTED_DESC=$(awk '/^Bundle-Description:/{flag=1; s=$0; next} flag && /^ /{s=s $0; next} flag{print s; exit}' tmp_pkg_meta/META-INF/MANIFEST.MF | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\r')
           
           if [ -n "$EXTRACTED_NAME" ]; then PKG_NAME="$EXTRACTED_NAME"; fi
           if [ -n "$EXTRACTED_DESC" ]; then PKG_DESC="$EXTRACTED_DESC"; fi
        fi
        
        echo "Updating Package Metadata via PUT... (Name: $PKG_NAME)"
        base64 -w 0 "$ZIPLOCATION" > pkg_encoded.txt
        jq -Rs --arg id "$PACKAGE_TECH_ID" --arg name "$PKG_NAME" --arg desc "$PKG_DESC" '{Id: $id, Name: $name, ShortText: $desc, PackageContent: .}' pkg_encoded.txt > pkg_payload.json
        
        curl_response=$(curl -s -w "\n%{http_code}" -X PUT "$BTP_API_URL/api/v1/IntegrationPackages('$PACKAGE_TECH_ID')" \
          -H "Authorization: $BEARER_TOKEN" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          --data-binary "@pkg_payload.json")

        HTTP_STATUS=$(echo "$curl_response" | tail -n1)
        if [ "$HTTP_STATUS" == "404" ]; then
          echo "⚠️ Package does not exist. Creating via POST..."
          curl_response=$(curl -s -w "\n%{http_code}" -X POST "$BTP_API_URL/api/v1/IntegrationPackages" \
            -H "Authorization: $BEARER_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "@pkg_payload.json")
          HTTP_STATUS=$(echo "$curl_response" | tail -n1)
          if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
             echo "❌ Error creating package: $HTTP_STATUS"
             exit 1
          fi
        elif [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ] && [ "$HTTP_STATUS" != "204" ]; then
           echo "❌ Error updating package: $HTTP_STATUS"
           exit 1
        fi
        echo "✅ Package metadata updated."

        echo "Extracting package ZIP to upload individual artifacts..."
        mkdir -p extracted_pkg
        unzip -q -o "$ZIPLOCATION" -d extracted_pkg
        cd extracted_pkg

        for artifact in *; do
          if [ -f "$artifact" ] && [ "$artifact" != "META-INF" ]; then
             if unzip -t "$artifact" >/dev/null 2>&1; then
                echo "Processing artifact archive: $artifact"
                rm -rf tmp_artifact
                unzip -q -o "$artifact" -d tmp_artifact
                
                if [ -f "tmp_artifact/META-INF/MANIFEST.MF" ]; then
                   ARTIFACT_ID=$(awk '/^Bundle-SymbolicName:/{flag=1; s=$0; next} flag && /^ /{s=s $0; next} flag{print s; exit}' tmp_artifact/META-INF/MANIFEST.MF | cut -d':' -f2 | cut -d';' -f1 | tr -d ' \r\n')
                   ARTIFACT_NAME=$(awk '/^Bundle-Name:/{flag=1; s=$0; next} flag && /^ /{s=s $0; next} flag{print s; exit}' tmp_artifact/META-INF/MANIFEST.MF | cut -d':' -f2 | tr -d '\r\n' | sed -e 's/^[[:space:]]*//')
                   if [ -z "$ARTIFACT_NAME" ]; then ARTIFACT_NAME="$ARTIFACT_ID"; fi
                   
                   if [ -n "$ARTIFACT_ID" ]; then
                      BUNDLE_TYPE=$(awk -F': ' '/^SAP-BundleType:/ {print $2}' tmp_artifact/META-INF/MANIFEST.MF | tr -d '\r\n')
                      if [ "$BUNDLE_TYPE" = "MessageMapping" ] || grep -qi "MessageMapping" tmp_artifact/META-INF/MANIFEST.MF; then
                         ENDPOINT="MessageMappingDesigntimeArtifacts"
                      elif [ "$BUNDLE_TYPE" = "ScriptCollection" ] || grep -qi "ScriptCollection" tmp_artifact/META-INF/MANIFEST.MF; then
                         ENDPOINT="ScriptCollectionDesigntimeArtifacts"
                      elif [ "$BUNDLE_TYPE" = "ValueMapping" ] || grep -qi "Value_Mapping" tmp_artifact/META-INF/MANIFEST.MF; then
                         ENDPOINT="ValueMappingDesigntimeArtifacts"
                      else
                         ENDPOINT="IntegrationDesigntimeArtifacts"
                      fi
                      
                      echo "Found artifact: $ARTIFACT_ID ($ARTIFACT_NAME) -> Endpoint: $ENDPOINT"
                      
                      echo "Checking if $ARTIFACT_ID exists in Designtime..."
                      check_resp=$(curl -s -w "\n%{http_code}" -X GET "$BTP_API_URL/api/v1/$ENDPOINT(Id='$ARTIFACT_ID',Version='active')" \
                        -H "Authorization: $BEARER_TOKEN" -H "Accept: application/json")
                      CHK_STATUS=$(echo "$check_resp" | tail -n1)
                      
                      base64 -w 0 "$artifact" > artifact_encoded.txt
                      
                      if [ "$CHK_STATUS" = "200" ]; then
                         echo "♻️ Artifact $ARTIFACT_ID exists. Updating existing artifact (PUT) to preserve version history..."
                         jq -Rs --arg name "$ARTIFACT_NAME" \
                           '{Name: $name, ArtifactContent: .}' artifact_encoded.txt > payload.json
                           
                         up_resp=$(curl -s -w "\n%{http_code}" -X PUT "$BTP_API_URL/api/v1/$ENDPOINT(Id='$ARTIFACT_ID',Version='active')" \
                           -H "Authorization: $BEARER_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
                           --data-binary "@payload.json")
                      else
                         echo "➕ Artifact $ARTIFACT_ID does not exist. Creating new artifact (POST)..."
                         jq -Rs --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" --arg pkg "$PACKAGE_TECH_ID" \
                           '{Id: $id, Name: $name, PackageId: $pkg, ArtifactContent: .}' artifact_encoded.txt > payload.json
                           
                         up_resp=$(curl -s -w "\n%{http_code}" -X POST "$BTP_API_URL/api/v1/$ENDPOINT" \
                           -H "Authorization: $BEARER_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
                           --data-binary "@payload.json")
                      fi
                      
                      UP_STATUS=$(echo "$up_resp" | tail -n1)
                      
                      if [ "$UP_STATUS" != "201" ] && [ "$UP_STATUS" != "200" ] && [ "$UP_STATUS" != "202" ] && [ "$UP_STATUS" != "204" ]; then
                         echo "❌ Error uploading artifact $ARTIFACT_ID: $UP_STATUS"
                         echo "$up_resp"
                         exit 1
                      fi
                      echo "✅ Successfully uploaded artifact $ARTIFACT_ID."
                   fi
                fi
             fi
          fi
        done
        echo "✅ All artifacts processed successfully."

